[package]
name = "kernest"
description = "Kernest — an open-source font editor for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kernest-core = { path = "../crates/kernest-core" }
kernest-export = { path = "../crates/kernest-export" }
kernest-import = { path = "../crates/kernest-import" }
kernest-check = { path = "../crates/kernest-check" }
kernest-script = { path = "../crates/kernest-script" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
rustybuzz = "0.20"
skrifa = "0.47"
reqwest = { version = "0.12", features = ["blocking"] }
semver = "1"
png = "0.18"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
