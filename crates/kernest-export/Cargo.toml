[package]
name = "kernest-export"
description = "Compiles Kernest fonts to TrueType and variable fonts using fontc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kernest-core = { path = "../kernest-core" }
fontc = { version = "2.0.1", default-features = false, features = ["rayon"] }
norad = "0.19.2"
tempfile = "3"
plist = "1"
serde.workspace = true
write-fonts = "0.55"
brotli = "9"
tilvisan = { version = "0.2.1", default-features = false }
