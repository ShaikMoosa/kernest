[workspace]
resolver = "2"
members = ["crates/kernest-core", "crates/kernest-export", "crates/kernest-import", "crates/kernest-script", "crates/kernest-check", "crates/kernest-cli", "src-tauri"]

[workspace.package]
version = "2.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ShaikMoosa/kernest"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
