name: Release

# Pushing a version tag (v1.2.0) tests, builds the setup installers for x64 and ARM64
# and publishes the GitHub release. The release notes are the annotated tag's message
# (its first line is the title):
#   git tag -a v1.2.0 --cleanup=verbatim -F notes.md && git push origin v1.2.0
# Run it by hand (Actions › Release › Run workflow) to build the installers without
# publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the app version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installs the toolchain pinned in rust-toolchain.toml, plus the target.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # The checks run once, on x64 (the ARM64 job only builds).
      - name: Typecheck and build frontend
        if: matrix.arch == 'x64'
        run: npm run build

      - name: Translations complete (Spanish, Arabic)
        if: matrix.arch == 'x64'
        run: npm run check:i18n

      - name: Rust format check
        if: matrix.arch == 'x64'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.arch == 'x64'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        if: matrix.arch == 'x64'
        run: cargo test --workspace

      # Download the pinned embeddable CPython for this architecture, check it
      # against the hash published on python.org, and unpack it where the build
      # expects the bundled runtime (src-tauri/python-runtime).
      - name: Bundle Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.arch }}' -eq 'x64') {
            $url = 'https://www.python.org/ftp/python/3.13.15/python-3.13.15-embed-amd64.zip'
            $sha = 'd1f04d990aee1253d8569e8e5104e30fa9f5fa830899f14843448872d936a2cf'
          } else {
            $url = 'https://www.python.org/ftp/python/3.13.15/python-3.13.15-embed-arm64.zip'
            $sha = 'cd992cbfb33be433ff20f150691595efb2862e56f4f1bec684c6077d4775af8e'
          }
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          $actual = (Get-FileHash python-embed.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) { throw "Python zip SHA256 mismatch: $actual != $sha" }
          $dest = 'src-tauri/python-runtime'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path python-embed.zip -DestinationPath $dest -Force
          # The embeddable distribution ignores PYTHONPATH while a ._pth file is
          # present, so list the package's parent directory (..) and enable site:
          # `python -m kernest` then resolves the package bundled beside the runtime.
          $pth = (Get-ChildItem "$dest/python*._pth" | Select-Object -First 1).FullName
          $zip = (Get-ChildItem "$dest/python*.zip" | Select-Object -First 1).Name
          Set-Content -Path $pth -Value "$zip`n.`n..`nimport site" -Encoding ascii

      # The runtime is downloaded above, so it is added to the bundled resources
      # here (not in tauri.conf.json) to keep ordinary builds and tests working
      # without it.
      - name: Build setup installer
        shell: bash
        run: npx tauri build --bundles nsis --target ${{ matrix.target }} --config '{"bundle":{"resources":{"python-runtime":"python/runtime"}}}'

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-files
          merge-multiple: true

      - name: Checksums
        run: |
          cd release-files
          sha256sum *-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        run: |
          # The annotated tag's message is the release notes.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          if [ ! -s notes.md ]; then echo "Kernest ${TAG#v}" > notes.md; fi
          title=$(head -n 1 notes.md | sed 's/^# *//')
          tail -n +2 notes.md > body.md
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" --verify-tag --title "$title" --notes-file body.md "${flags[@]}" release-files/*
