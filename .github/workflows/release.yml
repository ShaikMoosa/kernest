name: Release

# Pushing a version tag (v1.2.0) tests, builds the setup installer and publishes the
# GitHub release. The release notes are the annotated tag's message:
#   git tag -a v1.2.0 -F notes.md && git push origin v1.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (Windows x64)
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match the app version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build setup installer
        run: npx tauri build --bundles nsis

      - name: Checksums
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*-setup.exe dist/
          cd dist
          sha256sum *-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        shell: bash
        run: |
          # The annotated tag's message is the release notes.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          if [ ! -s notes.md ]; then echo "Kernest ${TAG#v}" > notes.md; fi
          title=$(head -n 1 notes.md | sed 's/^# *//')
          tail -n +2 notes.md > body.md
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" --verify-tag --title "$title" --notes-file body.md "${flags[@]}" dist/*
