name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Test and build installer (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # Distribution is a setup.exe only (no Store, no GitHub Releases, no winget).
      # CI builds it so every change is installable; it is kept as a build artifact.
      - name: Build setup installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: kernest-setup-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
